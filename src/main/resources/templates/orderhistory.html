<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a button {
            padding: 6px 12px;
            margin-right: 5px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        nav a button:hover {
            background-color: #555;
        }

        .order-card {
            border: 1px solid #ccc;
            width: 250px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            text-align: center;
            vertical-align: top;
        }

        .order-card img {
            margin-bottom: 10px;
        }

        .order-card p {
            margin: 5px 0;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav>
    <a href="/"><button>Home</button></a>
    <a href="/cart"><button>Cart</button></a>
    <a href="/orderhistory"><button>Order History</button></a>
    <a href="/login">
        <button th:text="${user != null} ? 'Switch User' : 'Login'"></button>
    </a>
</nav>

<h2>Order History</h2>

<div th:if="${#lists.isEmpty(orderedItems)}">
    <p>Your order history is empty.</p>
</div>

<div th:each="order : ${orderedItems}" class="order-card">

    <img th:src="${order.product.img}" width="150" height="180"><br>

    <b th:text="${order.product.name}">Product Name</b><br>

    <p>Quantity: <span th:text="${order.quantity}"></span></p>
    <p>Price: $<span th:text="${order.price}"></span></p>
    <p>Status: <span class="status" th:text="${order.status}"></span></p>

</div>

</body>
</html>
