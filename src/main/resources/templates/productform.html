<!DOCTYPE html>
<html>
<head>
    <title th:text="${product.id} != null ? 'Edit Product' : 'Add Product'">
        Product Form
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 15px;
        }

        input {
            display: block;
            margin-bottom: 10px;
            padding: 6px;
            width: 250px;
        }

        button {
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .delete-btn {
            background-color: #b02a2a;
            margin-left: 0px;
        }

        .delete-btn:hover {
            background-color: #8b1f1f;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h2 th:text="${product.id} != null ? 'Edit Product' : 'Add Product'"></h2>

<form th:action="@{/admin/products}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    Name:
    <input type="text" th:field="*{name}" required>

    Price:
    <input type="number" th:field="*{price}" required>

    Case Size:
    <input type="number" th:field="*{caseSize}" required>

    Type:
    <input type="text" th:field="*{type}" required>

    Width:
    <input type="number" th:field="*{width}" required>

    Material:
    <input type="text" th:field="*{material}" required>

    Image URL:
    <input type="text" th:field="*{img}" required>

    Description:
    <input type="text" th:field="*{description}" required>

    <button type="submit">
        <span th:text="${product.id} != null ? 'Update' : 'Create'"></span>
    </button>

</form>


<form th:if="${product.id} != null"
      th:action="@{/admin/products/delete/{id}(id=${product.id})}"
      method="post"
      style="display:inline;">

    <button type="submit" class="delete-btn">Delete </button>
</form>

<br>
<a href="/admin/products">Back to Products</a>

</body>
</html>
