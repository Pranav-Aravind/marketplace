<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .cart-card {
            border: 1px solid #ccc;
            width: 250px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            text-align: center;
            vertical-align: top;
        }

        .cart-card img {
            margin-bottom: 10px;
        }

        .cart-card p {
            margin: 5px 0;
        }

        button {
            margin-top: 8px;
            padding: 6px 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<h2>Your Cart</h2>

<div th:if="${#lists.isEmpty(cartItems)}">
    <p>Your cart is empty.</p>
</div>

<div th:each="order : ${cartItems}" class="cart-card">

    <img th:src="${order.product.img}" width="150" height="180"><br>

    <b th:text="${order.product.name}">Product Name</b><br>

    <p>Quantity: <span th:text="${order.quantity}"></span></p>
    <p>Price: $<span th:text="${order.price}"></span></p>

    <form th:action="@{/orderhistory}" method="post">
        <button type="submit">Place Order</button>
    </form>

</div>

</body>
</html>
