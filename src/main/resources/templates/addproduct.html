<!DOCTYPE html>
<html>
<head>
  <title>Add Product</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      display: flex;
      justify-content: center;
      background-color: #f9f9f9;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background-color: white;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      display: block;
      margin-bottom: 10px;
      padding: 6px;
      width: 100%;
    }

    button {
      margin-top: 10px;
      padding: 6px 12px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #555;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #333;
    }

    a:hover {
      text-decoration: underline;
    }

    nav {
      margin-bottom: 20px;
    }

    nav a button {
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <nav>
    <a href="/admin/products"><button>Products</button></a>
    <a href="/admin/customerorders"><button>Orders</button></a>
    <a href="/admin/products/new"><button>Add Product</button></a>
    <a href="/login">
      <button th:text="${user != null} ? 'Switch User' : 'Login'"></button>
    </a>
  </nav>

  <h2>Add Product</h2>

  <form th:action="@{/admin/products/save}" th:object="${product}" method="post">

    Name:
    <input type="text" th:field="*{name}" required>

    Price:
    <input type="number" th:field="*{price}" min="0" required>

    Case Size:
    <input type="number" th:field="*{caseSize}" min="0" required>

    Type:
    <input type="text" th:field="*{type}" required>

    Width:
    <input type="number" th:field="*{width}" min="0" required>

    Material:
    <input type="text" th:field="*{material}" required>

    Image URL:
    <input type="text" th:field="*{img}" required>

    Description:
    <input type="text" th:field="*{description}" required>

    <button type="submit">Create</button>

  </form>

  <br>
  <a href="/admin/products">Back to Products</a>

</div>

</body>
</html>
