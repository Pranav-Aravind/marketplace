<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Orders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .order-card {
            border: 1px solid #ccc;
            width: 260px;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            text-align: center;
            vertical-align: top;
        }

        .order-card img {
            margin-bottom: 10px;
        }

        .order-card p {
            margin: 5px 0;
        }

        select {
            margin-top: 8px;
            padding: 4px;
        }

        button {
            margin-top: 8px;
            padding: 6px 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Customer Orders</h2>

<div th:if="${#lists.isEmpty(orderedItems)}">
    <p>Customer orders is empty.</p>
</div>

<div th:each="order : ${orderedItems}" class="order-card">

    <img th:src="${order.product.img}" width="150" height="180"><br>

    <b th:text="${order.product.name}">Product Name</b><br>

    <p>Quantity: <span th:text="${order.quantity}"></span></p>
    <p>Price: $<span th:text="${order.price}"></span></p>
    <p>Customer: <b th:text="${order.user.username}">Username</b></p>

    <p>Current Status:
        <span class="status" th:text="${order.status}"></span>
    </p>

    <form th:action="@{/admin/customerorders/updateStatus}" method="post">
        <input type="hidden" name="orderId" th:value="${order.id}" />

        <select name="status">
            <option value="placed">PLACED</option>
            <option value="dispatched">DISPATCHED</option>
            <option value="delivered">DELIVERED</option>
        </select>

        <br>
        <button type="submit">Update</button>
    </form>

</div>

</body>
</html>
