<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f9f9;
        }

        form {
            max-width: 300px;
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        input {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 8px 16px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }

        button:hover {
            background-color: #555;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<form th:action="@{/login}" method="post">
    <h2>Login</h2>

    Username:
    <input type="text" name="username" required>

    Password:
    <input type="password" name="password" required>

    <button type="submit">Sign In</button>

    <p>Don't have an account? <a href="/register">Sign up</a></p>
    <p><a href="/register?admin=true">Register as admin</a></p>
</form>

</body>
</html>
