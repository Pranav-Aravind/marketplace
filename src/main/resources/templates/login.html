<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            max-width: 300px;
        }

        input {
            display: block;
            margin-bottom: 10px;
            padding: 6px;
            width: 100%;
        }

        button {
            padding: 6px 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h2>Login</h2>

<form th:action="@{/login}" method="post">

    Username:
    <input type="text" name="username" required>

    Password:
    <input type="password" name="password" required>

    <button type="submit">Sign In</button>

    <p>Don't have an account? <a href="/register">Sign up</a></p>
    <p><a href="/register?admin=true">Register as admin</a></p>

</form>

</body>
</html>
