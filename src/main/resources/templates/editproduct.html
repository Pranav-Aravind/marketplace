<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h2 { margin-bottom: 15px; }
        input { display: block; margin-bottom: 10px; padding: 6px; width: 250px; }
        button { margin-top: 10px; padding: 6px 12px; background-color: #333; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #555; }
        .delete-btn { background-color: #b02a2a; margin-left: 0px; }
        .delete-btn:hover { background-color: #8b1f1f; }
        a { display: inline-block; margin-top: 15px; text-decoration: none; color: #333; }
        a:hover { text-decoration: underline; }

        nav {
            margin-bottom: 20px;
        }

        nav a button {
            padding: 6px 12px;
            margin-right: 5px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        nav a button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<nav>
    <a href="/admin/products"><button>Products</button></a>
    <a href="/admin/customerorders"><button>Orders</button></a>
    <a href="/admin/products/new"><button>Add Product</button></a>
    <a href="/login">
        <button th:text="${user != null} ? 'Switch User' : 'Login'"></button>
    </a>
</nav>

<h2>Edit Product</h2>

<form th:action="@{/admin/products/save}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    Name:
    <input type="text" th:field="*{name}" required>

    Price:
    <input type="number" th:field="*{price}" required>

    Case Size:
    <input type="number" th:field="*{caseSize}" required>

    Type:
    <input type="text" th:field="*{type}" required>

    Width:
    <input type="number" th:field="*{width}" required>

    Material:
    <input type="text" th:field="*{material}" required>

    Image URL:
    <input type="text" th:field="*{img}" required>

    Description:
    <input type="text" th:field="*{description}" required>

    <button type="submit">Update</button>
</form>

<form th:action="@{/admin/deleteproduct/{id}(id=${product.id})}" method="post" style="display:inline;">
    <button type="submit" class="delete-btn">Hide product</button>
</form>

<br>
<a href="/admin/products">Back to Products</a>

</body>
</html>
