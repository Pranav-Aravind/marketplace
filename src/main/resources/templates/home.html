<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MarketPlace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a button {
            padding: 6px 12px;
            margin-right: 5px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        nav a button:hover {
            background-color: #555;
        }

        .btn {
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .filter {
            background-color: #333;
            color: white;
            border: none;
        }

        .product-card {
            border: 1px solid #ccc;
            width: 200px;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            text-align: center;
            vertical-align: top;
        }
    </style>
</head>
<body>

<nav>
    <a href="/"><button>Home</button></a>
    <a href="/cart"><button>Cart</button></a>
    <a href="/orderhistory"><button>Order History</button></a>
    <a href="/login">
        <button th:text="${user != null} ? 'Switch User' : 'Login'"></button>
    </a>
</nav>

<div th:if="${user != null}">
    <h3>Hello <span th:text="${user.username}"></span></h3>
</div>

<h2>Products</h2>

<div>

    <form method="get" action="/" style="margin-bottom:20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">

        <label style="margin:0;">Type:</label>
        <select name="type" style="height:32px;">
            <option value="">All Types</option>
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == param.type}"></option>
        </select>

        <label style="margin:0;">Min Price:</label>
        <input type="number" name="minPrice" step="10" min="0" th:value="${param.minPrice}" style="height:30px;"/>

        <label style="margin:0;">Max Price:</label>
        <input type="number" name="maxPrice" step="10" min="0" th:value="${param.maxPrice}" style="height:30px;"/>

        <button type="submit" class="filter" style="height:32px;">Filter</button>
        <button type="button" class="filter" style="height:32px; background-color:#ff0000;" onclick="window.location='/'">Clear Filters</button>

    </form>

    <div th:each="product : ${products}"
         class="product-card"
         th:onclick="|window.location='@{/productdetails/{id}(id=${product.id})}'|"
         style="border:1px solid black; width:200px; padding:10px; margin:10px; display:inline-block; text-align:center; cursor:pointer;">

        <img th:src="${product.img}" width="150" height="180"><br><br>

        <b th:text="${product.name}">Product Name</b><br>
        $<span th:text="${product.price}">0</span><br><br>
    </div>

</div>

</body>
</html>
